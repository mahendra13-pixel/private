{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramu Dai KO MOMO | Login </title>
    <!-- favicon -->
    <link rel="icon" href="{% static 'images/favicon_io/faviconn.ico' %}">
    <!-- mycss -->
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
    <!-- boo-css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- font -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- JavaScript -->
    <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css" />
</head>

<body>
    <div class="container">
        <div class="row  form_row ">
            <div class="col-4">
                <h3 class="alert  text-center text-info">WELCOME BACK!</h3>
            </div>
            <!-- <div class="col-2 crossx">
                <a href="{% url 'index' %}"><h1 class="alert  text-center text-info"><i class="fa-regular fa-circle-xmark"></i></h1></a>
            </div> -->
            <!-- From -->
            <div class="col-6 ">
                <form class="form" method="post" action="{% url 'log_in' %}">
                    {% csrf_token %}
                    <div class="iconX">
                        <p class="title">LogIn      </p>
                        <a class="crossX" href="{% url 'index' %}">
                            <h3><i class=" lert  text-center text-info fa-regular fa-circle-xmark"></i>
                            </h3>
                        </a>
                    </div>
                    <p class="message">Login now and get full access to our app. </p>

                    <label>
                        <input class="input" type="etext" name="username" placeholder="" required="">
                        <span>username</span>
                        <input type="hidden" name="next" value="{{next}}">
                    </label>

                    <label>
                        <input class="input" type="password" name="password" placeholder="" required="">
                        <span>Password</span>
                    </label>
                    <div>
                        <input type="checkbox" name="remember_me">
                        <label for="">Remember Me</label>
                    </div>
                    <button class="submit">Submit</button>
                    <div>
                        <a href="{% url 'social:begin' 'google-oauth2'%}"><i
                                class="fa-brands fa-google text-light m-2 fw-bolder "></i></a>
                        <a href="{% url 'social:begin' 'github'%}"><i
                                class="fa-brands fa-github text-light fw-bolder "></i></a>
                    </div>


                    <p class="signin">Dont have an acount ? <a href="{% url 'register' %}">Signup</a> </p>
                </form>
            </div>
        </div>
    </div>
    {% if messages %}
    {% for message in messages %}
    {% if message.tags == 'success' %}

    <script>alertify.set('notifier', 'position', 'bottom-right');
        alertify.success('{{message}}');
    </script>
    {%else%}
    <script>alertify.set('notifier', 'position', 'bottom-right');
        alertify.error('{{message}}');
    </script>
    {% endif %}
    {% endfor %}

    {% endif %}
    <!-- boos-js -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
